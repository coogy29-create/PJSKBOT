      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p /tmp/src/PJSKBOT assembleDebug

      - name: Prepare APK
        run: cp /tmp/src/PJSKBOT/app/build/outputs/apk/debug/app-debug.apk /tmp/PJSKBOT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PJSKBOT
          path: /tmp/PJSKBOT.apk
